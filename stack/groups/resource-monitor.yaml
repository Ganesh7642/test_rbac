template:
  path: resource_monitor.yaml

entries:
  - name: GEMINI_ENT_DEVELOPER_DEV_MONITOR
    frequency: MONTHLY
    start_time: IMMEDIATELY
    comment: Resource monitor for Gemini DEV developer warehouse
    triggers:
      - threshold: 75
        action: NOTIFY
      - threshold: 100
        action: NOTIFY

