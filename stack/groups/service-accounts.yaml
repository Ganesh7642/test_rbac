template:
  path: snowflake_user_accounts.yaml

defaults:
  alterableOnly: false

entries:
  - user_name: SVC_UAT_GEMINI_ENT_DEVELOPER
    login_name: SVC_UAT_GEMINI_ENT_DEVELOPER
    display_name: SVC_UAT_GEMINI_ENT_DEVELOPER
    user_type: SERVICE
    comment: Service account for Gemini Enterprise UAT developer workload
    default_warehouse: GEMINI_ENT_DEVELOPER_UAT
    default_role: FR_GEMINI_ENT_DEVELOPER
    default_secondary_roles: ALL
    disabled: false

  - user_name: SVC_UAT_GEMINI_ENT_VALIDATOR
    login_name: SVC_UAT_GEMINI_ENT_VALIDATOR
    display_name: SVC_UAT_GEMINI_ENT_VALIDATOR
    user_type: SERVICE
    comment: Service account for Gemini Enterprise UAT validator workload
    default_warehouse: GEMINI_ENT_VALIDATOR_UAT
    default_role: FR_GEMINI_ENT_VALIDATOR
    default_secondary_roles: ALL
    disabled: false

  - user_name: SVC_DBT_PROVISION_APP_TEST
    login_name: SVC_DBT_PROVISION_APP_TEST
    display_name: SVC_DBT_PROVISION_APP_TEST
    user_type: SERVICE
    comment: Service account for dbt workload provisioning_test
    default_warehouse: DBT_PROVISION_APP_WH_TEST
    default_role: FR_PROVISION_APP_TEST
    default_secondary_roles: ALL
    disabled: false
