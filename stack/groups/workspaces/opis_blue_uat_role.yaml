template:
  path: workspaces/workspaces_role.yaml

# Object-grant types supported by template for future/all-object grants:
# TABLE, VIEW, PROCEDURE, FUNCTION, SEQUENCE, STAGE, FILE FORMAT
# (both FILE_FORMAT and FILE FORMAT are accepted by template normalization)
#
# Example (enable only when spreadsheet explicitly requires):
# - schemas: [SOME_SCHEMA]
#   onType: SEQUENCE
#   privilege: ['usage']
# - schemas: [SOME_SCHEMA]
#   onType: STAGE
#   privilege: ['usage']
# - schemas: [SOME_SCHEMA]
#   onType: FILE FORMAT
#   privilege: ['usage']

