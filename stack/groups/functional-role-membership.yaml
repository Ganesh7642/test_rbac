# Grants roles to FR_PROVISION_APP and assigns warehouse privileges
# so all functional-role membership is managed in one place.

template:
  path: functional_role_membership.yaml

entries:
   - functional_role: FR_PROVISION_APP_TEST
    # Roles granted into FR_PROVISION_APP_TEST
    granted_roles:
      - name: OBJ_DB_DEVELOPMENT_USE_TEST
      - name: OBJ_DB_DEVELOPMENT_SELECT_TEST
    # Warehouse role
    warehouse_roles:
      - name: CR_DBT_PROVISION_APP_TEST

   - functional_role: FR_GEMINI_ENT_DEVELOPER
    granted_roles:
      - name: OPIS_BLUE_DEV.DR_OPIS_BLUE_DEV_RW
      - name: OPIS_BLUE_UAT.DR_OPIS_BLUE_DEV_RW
      - name: CIRCLE_K_DEV.DR_CIRCLE_K_DEV_RW
      - name: CIRCLE_K_UAT.DR_CIRCLE_K_UAT_RW
    warehouse_roles:
      - name: CR_GEMINI_ENT_DEVELOPER

   - functional_role: FR_GEMINI_ENT_DBT
    granted_roles:
      - name: OPIS_BLUE_UAT.DR_OPIS_BLUE_UAT_RW
      - name: CIRCLE_K_UAT.DR_CIRCLE_K_BLUE_RW
      - name: CIRCLE_K_UAT.DR_CIRCLE_K_BLUE_UAT_RW
    warehouse_roles:
      - name: CR_GEMINI_ENT_DBT

   - functional_role: FR_GEMINI_ENT_VALIDATOR
    granted_roles:
      - name: OPIS_BLUE_UAT.DR_GEMINI_ENT_VALIDATOR_RO
      - name: CIRCLE_K_UAT.DR_GEMINI_ENT_VALIDATOR_RO
    warehouse_roles:
      - name: CR_GEMINI_ENT_VALIDATOR
